<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tinder - Swipe Movies</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            position: relative;
            min-height: 600px;
            height: auto;
        }

        .card-stack {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .movie-card {
            position: absolute;
            width: 100%;
            min-height: 600px;
            max-height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 40px 20px;
            cursor: grab;
            user-select: none;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .movie-card:active {
            cursor: grabbing;
        }

        .movie-card.dragging {
            transition: none;
        }

        .movie-card.swiped-left {
            transform: translateX(-1000px) rotate(-30deg);
            opacity: 0;
        }

        .movie-card.swiped-right {
            transform: translateX(1000px) rotate(30deg);
            opacity: 0;
        }

        .movie-poster {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        .movie-title {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .movie-year {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 15px;
        }

        .movie-synopsis {
            font-size: 1em;
            color: #555;
            text-align: center;
            line-height: 1.5;
            max-height: 150px;
            overflow-y: auto;
            padding: 0 20px;
            margin-bottom: 20px;
        }

        .swipe-indicators {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .swipe-indicator {
            font-size: 3em;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .swipe-indicator.show {
            opacity: 1;
        }

        .swipe-indicator.like {
            color: #27ae60;
        }

        .swipe-indicator.pass {
            color: #e74c3c;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 40px;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .progress-bar {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            transition: width 0.3s;
        }

        .card-number {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #999;
            font-size: 14px;
        }

        .actions {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            font-size: 2em;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .btn-pass {
            background: #e74c3c;
            color: white;
        }

        .btn-like {
            background: #27ae60;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card-stack" id="cardStack">
            <div class="empty-state">
                <h2>No more movies!</h2>
                <p>All done! 🎉</p>
            </div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="actions">
            <button class="action-btn btn-pass" onclick="swipeLeft()">❌</button>
            <button class="action-btn btn-like" onclick="swipeRight()">❤️</button>
        </div>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDXSH_qARP8u4Yb8SZnL99C5aV-WvX51Bc",
            authDomain: "movie-tinder-c6c14.firebaseapp.com",
            projectId: "movie-tinder-c6c14",
            storageBucket: "movie-tinder-c6c14.firebasestorage.app",
            messagingSenderId: "690934277145",
            appId: "1:690934277145:web:52ca2cbcb6f3d144823688",
            measurementId: "G-XQE1KK5NC6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Collection name for movies
        const MOVIES_COLLECTION = 'movies';
        let movies = [];
        let currentIndex = 0;
        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let isDragging = false;
        let currentCard = null;
        let unsubscribe = null;
        let lastSwipedMovieId = null; // Track the last swiped movie to handle updates

        // Initialize
        function init() {
            setupRealtimeListener();
        }

        // Set up real-time listener for pending movies
        function setupRealtimeListener() {
            unsubscribe = db.collection(MOVIES_COLLECTION)
                .where('swipeStatus', '==', 'pending')
                .orderBy('addedDate', 'desc')
                .onSnapshot((snapshot) => {
                    const wasSwiping = lastSwipedMovieId !== null;
                    const previousLength = movies.length;
                    
                    movies = [];
                    snapshot.forEach((doc) => {
                        const movie = {
                            id: doc.id,
                            ...doc.data()
                        };
                        movies.push(movie);
                    });
                    
                    // Handle index adjustment when array updates
                    if (wasSwiping) {
                        // A movie was just swiped and removed
                        // The array has shifted, so currentIndex should point to the next movie
                        // Example: [A, B, C] index 0 → swipe A → [B, C] index 0 (now shows B)
                        // If currentIndex is out of bounds, we've reached the end
                        if (currentIndex >= movies.length) {
                            // We're past the end - will show empty state (correct behavior)
                        } else if (currentIndex < 0) {
                            // Safety check - shouldn't happen but ensure it's valid
                            currentIndex = 0;
                        }
                        // currentIndex is valid and points to next movie
                        lastSwipedMovieId = null; // Clear the flag
                    } else if (movies.length > previousLength) {
                        // New movies were added (not from a swipe)
                        // If we were at the end, move to the new movies
                        if (currentIndex >= previousLength && previousLength > 0) {
                            currentIndex = previousLength;
                        }
                    } else if (movies.length < previousLength && !wasSwiping) {
                        // Movie was removed but we didn't swipe it (shouldn't happen)
                        if (currentIndex >= movies.length && movies.length > 0) {
                            currentIndex = 0;
                        }
                    }
                    
                    // Final safety check - ensure currentIndex is always valid
                    if (movies.length > 0 && currentIndex < 0) {
                        currentIndex = 0;
                    }
                    
                    renderCards();
                }, (error) => {
                    console.error('Error listening to movies:', error);
                    // If orderBy fails, try without it (might need index)
                    db.collection(MOVIES_COLLECTION)
                        .where('swipeStatus', '==', 'pending')
                        .onSnapshot((snapshot) => {
                            movies = [];
                            snapshot.forEach((doc) => {
                                const movie = {
                                    id: doc.id,
                                    ...doc.data()
                                };
                                movies.push(movie);
                            });
                            if (currentIndex >= movies.length && movies.length > 0) {
                                currentIndex = 0;
                            }
                            renderCards();
                        });
                });
        }

        // Save swipe result to Firestore
        async function saveSwipe(movieId, direction) {
            const newStatus = direction === 'right' ? 'liked' : 'passed';
            try {
                await db.collection(MOVIES_COLLECTION).doc(movieId).update({
                    swipeStatus: newStatus,
                    swipedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (error) {
                console.error('Error saving swipe:', error);
                alert('Error saving your choice. Please try again.');
            }
        }

        // Render cards
        function renderCards() {
            const cardStack = document.getElementById('cardStack');
            
            // Safety check - ensure currentIndex is valid
            if (currentIndex < 0) {
                currentIndex = 0;
            }
            
            if (movies.length === 0) {
                cardStack.innerHTML = `
                    <div class="empty-state">
                        <h2>No more movies!</h2>
                        <p>All done! 🎉</p>
                    </div>
                `;
                updateProgress();
                return;
            }
            
            if (currentIndex >= movies.length) {
                cardStack.innerHTML = `
                    <div class="empty-state">
                        <h2>No more movies!</h2>
                        <p>All done! 🎉</p>
                    </div>
                `;
                updateProgress();
                return;
            }

            // Show up to 3 cards at once
            const cardsToShow = Math.min(3, movies.length - currentIndex);
            cardStack.innerHTML = '';

            for (let i = 0; i < cardsToShow; i++) {
                const movieIndex = currentIndex + i;
                if (movieIndex < movies.length) {
                    const movie = movies[movieIndex];
                    const card = createCard(movie, i);
                    cardStack.appendChild(card);
                }
            }

            currentCard = cardStack.querySelector('.movie-card');
            if (currentCard) {
                setupDrag(currentCard);
            }

            updateProgress();
        }

        // Create card element
        function createCard(movie, index) {
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.dataset.movieId = movie.id.toString();
            card.style.zIndex = 100 - index;
            card.style.transform = `scale(${1 - index * 0.05}) translateY(${index * 10}px)`;

            const posterHtml = movie.posterUrl ? 
                `<img src="${movie.posterUrl}" alt="${movie.title}" class="movie-poster" onerror="this.style.display='none'">` : 
                '';
            
            const synopsisHtml = movie.synopsis ? 
                `<div class="movie-synopsis">${movie.synopsis}</div>` : 
                '';

            card.innerHTML = `
                <div class="swipe-indicators">
                    <div class="swipe-indicator pass">❌</div>
                    <div class="swipe-indicator like">❤️</div>
                </div>
                <div class="card-number">${currentIndex + index + 1} / ${movies.length}</div>
                ${posterHtml}
                <div class="movie-title">${movie.title}</div>
                ${movie.year ? `<div class="movie-year">${movie.year}</div>` : ''}
                ${synopsisHtml}
            `;

            return card;
        }

        // Setup drag functionality
        function setupDrag(card) {
            card.addEventListener('mousedown', startDrag);
            card.addEventListener('touchstart', startDrag, { passive: true });
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: true });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function startDrag(e) {
            if (!currentCard) return;
            isDragging = true;
            currentCard.classList.add('dragging');
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            startX = clientX;
            startY = clientY;
            
            const rect = currentCard.getBoundingClientRect();
            currentX = rect.left + rect.width / 2;
            currentY = rect.top + rect.height / 2;
        }

        function drag(e) {
            if (!isDragging || !currentCard) return;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const deltaX = clientX - startX;
            const deltaY = clientY - startY;
            
            const rotation = deltaX * 0.1;
            const opacity = 1 - Math.abs(deltaX) / 300;
            
            currentCard.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${rotation}deg)`;
            currentCard.style.opacity = Math.max(0.5, opacity);
            
            // Show indicators
            const indicators = currentCard.querySelectorAll('.swipe-indicator');
            if (deltaX > 50) {
                indicators[1].classList.add('show'); // Like
                indicators[0].classList.remove('show');
            } else if (deltaX < -50) {
                indicators[0].classList.add('show'); // Pass
                indicators[1].classList.remove('show');
            } else {
                indicators.forEach(ind => ind.classList.remove('show'));
            }
        }

        function endDrag(e) {
            if (!isDragging || !currentCard) return;
            isDragging = false;
            
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const deltaX = clientX - startX;
            
            if (Math.abs(deltaX) > 100) {
                if (deltaX > 0) {
                    swipeRight();
                } else {
                    swipeLeft();
                }
            } else {
                // Snap back
                currentCard.style.transform = '';
                currentCard.style.opacity = '1';
                currentCard.classList.remove('dragging');
                const indicators = currentCard.querySelectorAll('.swipe-indicator');
                indicators.forEach(ind => ind.classList.remove('show'));
            }
        }

        function swipeRight() {
            if (!currentCard || currentIndex >= movies.length) return;
            
            const movieId = currentCard.dataset.movieId;
            lastSwipedMovieId = movieId; // Track which movie was swiped
            saveSwipe(movieId, 'right');
            
            currentCard.classList.add('swiped-right');
            
            // Force a re-render after animation to ensure next movie appears
            // The real-time listener should have already updated the array
            setTimeout(() => {
                renderCards();
            }, 350); // Slightly longer than animation to ensure it completes
        }

        function swipeLeft() {
            if (!currentCard || currentIndex >= movies.length) return;
            
            const movieId = currentCard.dataset.movieId;
            lastSwipedMovieId = movieId; // Track which movie was swiped
            saveSwipe(movieId, 'left');
            
            currentCard.classList.add('swiped-left');
            
            // Force a re-render after animation to ensure next movie appears
            // The real-time listener should have already updated the array
            setTimeout(() => {
                renderCards();
            }, 350); // Slightly longer than animation to ensure it completes
        }

        function updateProgress() {
            const progress = movies.length > 0 ? ((currentIndex / movies.length) * 100) : 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                swipeLeft();
            } else if (e.key === 'ArrowRight') {
                swipeRight();
            }
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (unsubscribe) {
                unsubscribe();
            }
        });

        // Initialize on load
        init();
    </script>
</body>
</html>
